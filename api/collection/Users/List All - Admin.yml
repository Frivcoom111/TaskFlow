info:
  name: List All - Admin
  type: http
  seq: 1

http:
  method: GET
  url: "{{baseURL}}/api/users"
  auth:
    type: bearer
    token: "{{token}}"

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

examples:
  - name: Unauthorized
    description: Exemplo de request a rota que possui auth.
    request:
      url: "{{baseURL}}/api/users"
      method: GET
    response:
      status: 401
      statusText: Unauthorized
      headers:
        - name: host
          value: localhost:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.5.0
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Sat, 12 Sep 2026 03:22:30 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "message": "Unauthenticated."
          }
  - name: Forbidden
    description: Exemplo de erro de auth.
    request:
      url: "{{baseURL}}/api/users"
      method: GET
    response:
      status: 403
      statusText: Forbidden
      headers:
        - name: host
          value: localhost:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.5.0
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Sat, 12 Sep 2026 03:37:04 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
            "message": "This action is unauthorized."
          }
  - name: Sucess
    request:
      url: "{{baseURL}}/api/users"
      method: GET
    response:
      status: 200
      statusText: OK
      headers:
        - name: host
          value: localhost:8000
        - name: connection
          value: close
        - name: x-powered-by
          value: PHP/8.5.0
        - name: cache-control
          value: no-cache, private
        - name: date
          value: Sat, 12 Sep 2026 03:38:02 GMT
        - name: content-type
          value: application/json
        - name: access-control-allow-origin
          value: "*"
      body:
        type: json
        data: |-
          {
